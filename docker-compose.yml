# Full CuraVision stack for local development and integration testing.
#
#   docker compose up -d                # start everything
#   docker compose up -d postgres redis # only infra
#   docker compose logs -f backend      # tail a service
#   docker compose down -v              # nuke data volumes too
#
# Ports exposed on the host:
#   frontend     http://localhost:3000
#   backend      http://localhost:3001
#   ai-service   http://localhost:8001
#   postgres     localhost:5432
#   redis        localhost:6379
#   chromadb     http://localhost:8000
#   minio s3     http://localhost:9000
#   minio console http://localhost:9001


services:
  # ---------- Infra ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curavision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curavision}
      POSTGRES_DB: ${POSTGRES_DB:-curavision}
    volumes:
      - curavision_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-curavision}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - curavision_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:1.0.15
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - curavision_chroma:/chroma/chroma
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 15s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-curavision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-curavision}
    volumes:
      - curavision_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 10

  # Creates the default `curavision` bucket once MinIO is healthy.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-curavision} ${MINIO_ROOT_PASSWORD:-curavision} &&
      mc mb --ignore-existing local/curavision &&
      echo 'minio bucket ready'"
    restart: on-failure

  # ---------- Application services ----------
  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    image: curavision/ai-service:dev
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      BACKEND_CALLBACK_URL: http://backend:3001
      ML_ROOT: /ml
      PYTHONPATH: /ml
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - curavision_backend_storage:/app/storage
      - ./ml:/ml

  ai-worker:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    image: curavision/ai-service:dev
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app.celery", "worker", "--loglevel=info"]
    env_file:
      - ./ai-service/.env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      BACKEND_CALLBACK_URL: http://backend:3001
      ML_ROOT: /ml
      PYTHONPATH: /ml
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - curavision_backend_storage:/app/storage
      - ./ml:/ml

  db-migrate:
    build:
      context: ./backend
    image: curavision/backend:dev
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-curavision}:${POSTGRES_PASSWORD:-curavision}@postgres:5432/${POSTGRES_DB:-curavision}?schema=public&connection_limit=2
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: curavision/backend:dev
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      RUN_DB_SEED: "true"
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-curavision}:${POSTGRES_PASSWORD:-curavision}@postgres:5432/${POSTGRES_DB:-curavision}?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379/1
      AI_SERVICE_URL: http://ai-service:8001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "300"
      AUTH_RATE_LIMIT_WINDOW_MS: "60000"
      AUTH_RATE_LIMIT_MAX: "20"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: curavision
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-curavision}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-curavision}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_FROM: ${SMTP_FROM}
      BACKEND_URL: ${BACKEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
      minio-bootstrap:
        condition: service_completed_successfully
    volumes:
      - curavision_backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        # Public env vars are baked at build time by Next.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    image: curavision/frontend:dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  curavision_pg:
  curavision_redis:
  curavision_chroma:
  curavision_minio:
  curavision_backend_storage:
