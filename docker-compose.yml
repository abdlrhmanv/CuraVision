# Full CuraVision stack for local development and integration testing.
#
#   docker compose up -d                # start everything
#   docker compose up -d postgres redis # only infra
#   docker compose logs -f backend      # tail a service
#   docker compose down -v              # nuke data volumes too
#
# Ports exposed on the host:
#   frontend     http://localhost:3000
#   backend      http://localhost:3001
#   ai-service   http://localhost:8001
#   postgres     localhost:5432
#   redis        localhost:6379
#   chromadb     http://localhost:8000
#   minio s3     http://localhost:9000
#   minio console http://localhost:9001

name: curavision

services:
  # ---------- Infra ----------
  postgres:
    image: postgres:16-alpine
    container_name: curavision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curavision
      POSTGRES_PASSWORD: curavision
      POSTGRES_DB: curavision
    ports: ["5432:5432"]
    volumes:
      - curavision_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "curavision"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: curavision-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - curavision_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:1.0.15
    container_name: curavision-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports: ["8000:8000"]
    volumes:
      - curavision_chroma:/chroma/chroma
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 15s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: curavision-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: curavision
      MINIO_ROOT_PASSWORD: curavision
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - curavision_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 10

  # Creates the default `curavision` bucket once MinIO is healthy.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: curavision-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 curavision curavision &&
      mc mb --ignore-existing local/curavision &&
      mc anonymous set download local/curavision &&
      echo 'minio bucket ready'"
    restart: on-failure

  # ---------- Application services ----------
  ai-service:
    build:
      context: ./ai-service
    image: curavision/ai-service:dev
    container_name: curavision-ai-service
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      BACKEND_CALLBACK_URL: http://backend:3001
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports: ["8001:8001"]

  ai-worker:
    build:
      context: ./ai-service
    image: curavision/ai-service:dev
    container_name: curavision-ai-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app.celery", "worker", "--loglevel=info"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      BACKEND_CALLBACK_URL: http://backend:3001
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: curavision/backend:dev
    container_name: curavision-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      DATABASE_URL: postgresql://curavision:curavision@postgres:5432/curavision?schema=public
      AI_SERVICE_URL: http://ai-service:8001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "300"
      AUTH_RATE_LIMIT_WINDOW_MS: "60000"
      AUTH_RATE_LIMIT_MAX: "20"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: curavision
      S3_ACCESS_KEY: curavision
      S3_SECRET_KEY: curavision
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      minio-bootstrap:
        condition: service_completed_successfully
    ports: ["3001:3001"]
    volumes:
      - curavision_backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        # Public env vars are baked at build time by Next.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    image: curavision/frontend:dev
    container_name: curavision-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      backend:
        condition: service_started
    ports: ["3000:3000"]

volumes:
  curavision_pg:
  curavision_redis:
  curavision_chroma:
  curavision_minio:
  curavision_backend_storage:
