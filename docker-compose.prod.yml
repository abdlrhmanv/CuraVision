# Production Docker Compose overrides for CuraVision stack.
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ---------- Infra Override ----------
  postgres:
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  chromadb:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  minio:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ---------- Application overrides ----------
  ai-service:
    image: ghcr.io/abdlrhmanv/curavision/ai-service:latest
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  ai-worker:
    image: ghcr.io/abdlrhmanv/curavision/ai-service:latest
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  backend:
    image: ghcr.io/abdlrhmanv/curavision/backend:latest
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  db-migrate:
    image: ghcr.io/abdlrhmanv/curavision/backend:latest
    build: !reset null

  frontend:
    image: ghcr.io/abdlrhmanv/curavision/frontend:latest
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ---------- Reverse Proxy Container ----------
  proxy:
    image: nginx:1.27-alpine
    container_name: curavision-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
