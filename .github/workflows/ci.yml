name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Express 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: curavision
          POSTGRES_PASSWORD: curavision
          POSTGRES_DB: curavision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curavision -d curavision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (node --check on every source file)
        run: npm run lint

      - name: Migrate and Seed Database
        env:
          DATABASE_URL: postgresql://curavision:curavision@localhost:5432/curavision
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: Route tests
        env:
          JWT_SECRET: ci-secret
          CORS_ORIGIN: "*"
          DATABASE_URL: postgresql://curavision:curavision@localhost:5432/curavision
        run: npm test

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install (runtime + dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app

      - name: Contract tests
        env:
          GROQ_API_KEY: test-key
          LLM_PROVIDER: groq
          CHROMA_HOST: ""
        run: pytest -q tests/

  frontend:
    name: Frontend (Next 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    # Only verify images build on PRs / main; no publish.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: curavision/backend:ci

      - name: Build ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: false
          tags: curavision/ai-service:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: curavision/frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3001

  integration-tests:
    name: End-to-End Integration
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CORS_ORIGIN: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - name: Start services with docker-compose
        run: |
          touch ai-service/.env
          touch backend/.env
          touch frontend/.env.local

          docker compose up -d

          # Wait for backend to be healthy (ok = all up, degraded = AI service down)
          echo "Waiting for backend to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001/health | grep -qE "\"status\":\"(ok|degraded)\""; do sleep 2; done'

      - name: Run smoke tests
        run: |
          cd backend
          BASE_URL=http://localhost:3001 bash tests/smoke-mvp.sh
