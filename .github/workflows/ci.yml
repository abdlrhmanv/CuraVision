name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  JWT_SECRET: ci-secret
  INTERNAL_SERVICE_TOKEN: ci-internal-token
  NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curavision
          POSTGRES_PASSWORD: curavision
          POSTGRES_DB: curavision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curavision -d curavision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Prepare database
        env:
          DATABASE_URL: postgresql://curavision:curavision@localhost:5432/curavision
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: Test
        env:
          DATABASE_URL: postgresql://curavision:curavision@localhost:5432/curavision
          JWT_SECRET: ci-secret
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          CORS_ORIGIN: "*"
          REDIS_URL: redis://localhost:6379/1
        run: npm test

  ai_service:
    name: AI Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app

      - name: Test
        env:
          GROQ_API_KEY: test-key
          LLM_PROVIDER: groq
          CHROMA_HOST: ""
          INTERNAL_SERVICE_TOKEN: ci-internal-token
        run: pytest -q tests/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, ai_service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: curavision/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build ai-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: false
          tags: curavision/ai-service:ci
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: curavision/frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [docker_build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment files
        run: |
          {
            echo "JWT_SECRET=ci-secret"
            echo "INTERNAL_SERVICE_TOKEN=ci-internal-token"
            echo "INFERENCE_STRATEGY=interim"
            echo "LLM_PROVIDER=groq"
            echo "POSTGRES_USER=curavision"
            echo "POSTGRES_PASSWORD=curavision"
            echo "POSTGRES_DB=curavision"
            echo "MINIO_ROOT_USER=curavision"
            echo "MINIO_ROOT_PASSWORD=curavision"
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"
            echo "CORS_ORIGIN=http://localhost:3000"
            echo "BACKEND_URL=http://localhost:3001"
            echo "NEXT_PUBLIC_API_BASE_URL=http://localhost:3001"
          } > .env
          cp .env ai-service/.env
          cp .env backend/.env
          touch frontend/.env.local

      - name: Start stack
        run: |
          docker compose up -d postgres redis minio chromadb
          docker compose up -d minio-bootstrap db-migrate
          docker compose up -d ai-service ai-worker
          docker compose up -d backend frontend

          echo "Waiting for backend health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health | grep -qE '"status":"ok"'; then
              echo "Backend is healthy"
              break
            fi
            sleep 5
          done
          if ! curl -sf http://localhost:3001/health | grep -qE '"status":"ok"'; then
            echo "Backend failed to start"
            docker compose logs backend ai-service ai-worker
            exit 1
          fi

          echo "Waiting for Celery worker..."
          for i in $(seq 1 30); do
            if docker compose exec -T ai-worker celery -A app.worker.celery_app.celery inspect ping -t 5 2>/dev/null | grep -q OK; then
              echo "AI worker is ready"
              exit 0
            fi
            sleep 3
          done
          echo "AI worker failed to start"
          docker compose logs ai-worker ai-service
          exit 1

      - name: Smoke test
        run: bash backend/tests/smoke-mvp.sh
        env:
          BASE_URL: http://localhost:3001

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, ai_service, frontend, docker_build, integration]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "ai_service=${{ needs.ai_service.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "docker_build=${{ needs.docker_build.result }}"
          echo "integration=${{ needs.integration.result }}"
          for result in \
            "${{ needs.backend.result }}" \
            "${{ needs.ai_service.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.docker_build.result }}" \
            "${{ needs.integration.result }}"; do
            if [[ "${result}" != "success" ]]; then
              echo "One or more CI jobs failed"
              exit 1
            fi
          done
          echo "All CI jobs passed"
