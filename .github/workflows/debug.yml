name: Debug VM
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker ps -a
            docker logs curavision-proxy || true
            ls -la /opt/curavision/nginx/certs
            cat /opt/curavision/nginx/nginx.conf || true
