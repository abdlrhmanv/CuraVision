name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Backend ----------
      - name: Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ---------- AI Service ----------
      - name: Docker metadata for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ai-service
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push AI Service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}

      # ---------- Frontend ----------
      - name: Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  deploy:
    name: Deploy to Production
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-Deploy Setup & Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # 1. Clean up old "cura vision" repo if it exists
            echo "Stopping old containers..."
            docker rm -f $(docker ps -aq) || true
            docker network prune -f || true
            
            for dir in "$HOME/cura-vision" "$HOME/CuraVision" "$HOME/curavision"; do
              if [ -d "$dir" ]; then
                echo "Removing old repo at $dir"
                rm -rf "$dir"
              fi
            done
            
            # 2. Setup production directory
            sudo mkdir -p /opt/curavision/nginx/certs
            sudo chown -R $USER:$USER /opt/curavision
            
            # 3. Generate self-signed SSL cert if it doesn't exist
            if [ ! -f /opt/curavision/nginx/certs/curavision.crt ]; then
              echo "Generating self-signed SSL certificate..."
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /opt/curavision/nginx/certs/curavision.key \
                -out /opt/curavision/nginx/certs/curavision.crt \
                -subj "/C=US/ST=State/L=City/O=CuraVision/CN=localhost"
            fi
            # Ensure certificates are readable by Nginx container
            chmod 644 /opt/curavision/nginx/certs/curavision.crt /opt/curavision/nginx/certs/curavision.key

      - name: Copy Compose files and Nginx config to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,nginx/"
          target: "/opt/curavision"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/curavision
            
            # 4. Generate .env file
            JWT_SEC=$(openssl rand -hex 32)
            cat <<EOF > .env
            JWT_SECRET=${JWT_SEC}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            POSTGRES_USER=curavision
            POSTGRES_PASSWORD=curavision_prod_pass
            POSTGRES_DB=curavision
            MINIO_ROOT_USER=curavision
            MINIO_ROOT_PASSWORD=curavision_prod_pass
            CORS_ORIGIN=https://${{ secrets.PROD_SSH_HOST }}
            BACKEND_URL=https://${{ secrets.PROD_SSH_HOST }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            EOF
            
            # Also copy .env to ai-service directory
            mkdir -p ai-service
            cp .env ai-service/.env
            
            # 5. Login, Pull, and Deploy
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -af
