name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: short git SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  resolve-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Determine deploy tag
        id: tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: resolve-tag
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

  build-ai-service:
    name: Build AI Service
    runs-on: ubuntu-latest
    needs: resolve-tag
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/ai-service
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
          provenance: false

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: resolve-tag
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://curavision.mooo.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [resolve-tag, build-backend, build-ai-service, build-frontend]
    environment:
      name: production
      url: https://curavision.mooo.com
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/curavision/nginx/certs
            sudo chown -R "$USER:$USER" /opt/curavision

      - name: Copy deployment assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,nginx/,scripts/download_weights.sh,scripts/deploy_prod.sh,scripts/setup_prod_certs.sh"
          target: "/opt/curavision"

      - name: Setup TLS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            chmod +x /opt/curavision/scripts/setup_prod_certs.sh
            DEPLOY_DIR=/opt/curavision bash /opt/curavision/scripts/setup_prod_certs.sh

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          CURAVISION_IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MODEL_WEIGHTS_URL: ${{ secrets.MODEL_WEIGHTS_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: CURAVISION_IMAGE_TAG,GROQ_API_KEY,INTERNAL_SERVICE_TOKEN,SMTP_HOST,SMTP_USER,SMTP_PASS,SMTP_PORT,SMTP_SECURE,SMTP_FROM,MODEL_WEIGHTS_URL,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            chmod +x /opt/curavision/scripts/deploy_prod.sh
            DEPLOY_DIR=/opt/curavision bash /opt/curavision/scripts/deploy_prod.sh

      - name: Post-deploy verification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/curavision
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            curl -fsS https://curavision.mooo.com/health | grep -q '"status":"ok"'
            echo "Production deploy verified"
